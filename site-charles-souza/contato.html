<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfólio - Sobre mim</title>

  <!-- Link para o arquivo CSS externo -->
  <link rel="stylesheet" href="estilo.css">
</head>
<body>

  <!-- Cabeçalho com menu de navegação fixo -->
  <header>

    <nav class="menu">
        <div class="container">

            <button id="menuToggle">☰</button>

            <ul id="menuLista">
            <li><a href="index.html">Sobre mim</a></li>
            <li><a href="formacao.html">Formação</a></li>
            <li><a href="portfolio.html">Portfólio</a></li>
            <li><a href="contato.html">Contato</a></li>
            </ul>


        </div>

    </nav>

  </header>

  <!-- Conteúdo principal da página -->
  <main>

  <section class="contato">

    <h1>Contato</h1>

    <p>
      Preencha o formulário abaixo para entrar em contato.
    </p>

    <!-- Formulário de contato -->
    <form id="formContato">

      <!-- Campo nome -->
      <label for="nome">Nome</label>
      <input type="text" id="nome" placeholder="Digite seu nome">

      <!-- Campo e-mail -->
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="Digite seu e-mail">

      <!-- Campo mensagem -->
      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem" rows="6" placeholder="Digite sua mensagem"></textarea>

      <!-- Botão enviar -->
      <button type="submit">Enviar</button>

    </form>

    <!-- Mensagem exibida após envio -->
    <p id="mensagemSucesso"></p>

  </section>

</main>

  <!-- Rodapé do site -->
  <footer>
    <p>&copy; 2026 - Charles Souza</p>
  </footer>

  <!-- Script JavaScript externo -->
  <script src="script.js"></script>

</body>
</html>
